name: Publish daily calendar JSON

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Calendar date to generate, in YYYY-MM-DD. Leave blank for today in CALENDAR_TZ."
        required: false
        type: string
  schedule:
    # Runs just after midnight in Asia/Taipei.
    - cron: "10 16 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CALENDAR_TZ: Asia/Taipei
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate calendar JSON
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            pnpm run generate -- --date "${{ inputs.date }}" --out data/today.json --date-out-dir data/days
          else
            pnpm run generate:today
          fi

      - name: Upload today JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: today-json
          path: data/today.json
          if-no-files-found: error

      - name: Commit updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update calendar JSON"
          file_pattern: "data/today.json data/days/*.json"
